apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - blueprints-generator.yaml

configMapGenerator:
  - name: authentik-users-blueprint
    files:
      - blueprints/users.yaml

resources:
  - argo-app.yaml
  - users.enc.yaml
  - secrets.enc.yaml
  - oidc-clients.enc.yaml

# Roll the worker whenever the aggregated blueprint contents change so
# Authentik discovers and applies additions and updates immediately.
replacements:
  - source:
      kind: ConfigMap
      name: authentik-blueprints
      fieldPath: metadata.annotations.blueprints-checksum
    targets:
      - select:
          kind: Application
          name: authentik
        fieldPaths:
          - spec.source.helm.valuesObject.worker.podAnnotations.blueprints-checksum
        options:
          create: true

# Rewrites the valkey sidecar StatefulSet embedded in the Application's helm
# valuesObject (kustomize's images transformer matches any containers[] list).
images:
  - name: valkey/valkey
    newTag: "9-alpine"
