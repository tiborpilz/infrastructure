apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.165.0
    helm:
      releaseName: otel-collector
      valuesObject:
        image:
          repository: otel/opentelemetry-collector-contrib
        mode: deployment
        replicaCount: 1
        presets:
          kubernetesAttributes:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        extraEnvs:
          - name: OPENROUTER_OTEL_TOKEN
            valueFrom:
              secretKeyRef:
                name: otel-collector-openrouter
                key: token
        ports:
          otlp:
            enabled: true
          otlp-http:
            enabled: true
          otlp-public:
            enabled: true
            containerPort: 4319
            servicePort: 4319
            protocol: TCP
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        config:
          extensions:
            bearertokenauth/openrouter:
              scheme: Bearer
              token: ${env:OPENROUTER_OTEL_TOKEN}
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            otlp/openrouter:
              protocols:
                http:
                  endpoint: 0.0.0.0:4319
                  auth:
                    authenticator: bearertokenauth/openrouter
          connectors:
            # RED metrics off the OpenRouter spans, labelled by GenAI
            # semconv attributes so Grafana can break down by model.
            span_metrics/openrouter:
              namespace: gen_ai
              histogram:
                unit: s
                explicit:
                  buckets: [100ms, 500ms, 1s, 2s, 5s, 10s, 20s, 30s, 60s, 120s]
              dimensions:
                - name: gen_ai.system
                - name: gen_ai.operation.name
                - name: gen_ai.request.model
                - name: gen_ai.response.model
              exemplars:
                enabled: true
              metrics_flush_interval: 15s
            # Token and cost totals. span_metrics only counts spans and
            # measures duration, so the numeric usage attributes need their
            # own connector. Conditions skip spans missing the attribute
            # rather than summing a zero.
            sum/openrouter:
              spans:
                gen_ai.usage.input_tokens:
                  source_attribute: gen_ai.usage.input_tokens
                  conditions:
                    - attributes["gen_ai.usage.input_tokens"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
                gen_ai.usage.output_tokens:
                  source_attribute: gen_ai.usage.output_tokens
                  conditions:
                    - attributes["gen_ai.usage.output_tokens"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
                gen_ai.usage.cost:
                  source_attribute: gen_ai.usage.cost
                  conditions:
                    - attributes["gen_ai.usage.cost"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
                gen_ai.usage.input_tokens.cached:
                  source_attribute: gen_ai.usage.input_tokens.cached
                  conditions:
                    - attributes["gen_ai.usage.input_tokens.cached"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
                gen_ai.usage.output_tokens.reasoning:
                  source_attribute: gen_ai.usage.output_tokens.reasoning
                  conditions:
                    - attributes["gen_ai.usage.output_tokens.reasoning"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
                gen_ai.openrouter.first_token_ms:
                  source_attribute: trace.metadata.openrouter.first_token_ms
                  conditions:
                    - attributes["trace.metadata.openrouter.first_token_ms"] != nil
                  attributes:
                    - key: gen_ai.request.model
                      default_value: unknown
          processors:
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch: {}
            resource/openrouter:
              attributes:
                - key: service.name
                  value: openrouter
                  action: insert
            resource/openrouter_metrics:
              attributes:
                - key: openrouter.trace.id
                  action: delete
            deltatocumulative:
              max_stale: 1h
          exporters:
            otlp/tempo:
              endpoint: tempo.observability.svc.cluster.local:4317
              tls:
                insecure: true
            prometheusremotewrite:
              endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
              resource_to_telemetry_conversion:
                enabled: true
            otlphttp/loki:
              endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
          service:
            extensions: [health_check, bearertokenauth/openrouter]
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp/tempo]
              traces/openrouter:
                receivers: [otlp/openrouter]
                processors: [memory_limiter, resource/openrouter, batch]
                exporters: [otlp/tempo]
              traces/openrouter_metrics:
                receivers: [otlp/openrouter]
                processors: [memory_limiter, resource/openrouter, resource/openrouter_metrics, batch]
                exporters: [span_metrics/openrouter, sum/openrouter]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [prometheusremotewrite]
              metrics/openrouter:
                receivers: [span_metrics/openrouter, sum/openrouter]
                processors: [memory_limiter, deltatocumulative, batch]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlphttp/loki]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
