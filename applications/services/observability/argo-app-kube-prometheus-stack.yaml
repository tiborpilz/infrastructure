apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.13.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        crds:
          enabled: true

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: "18GB"
            enableRemoteWriteReceiver: true
            enableFeatures:
              - otlp-write-receiver
              - exemplar-storage
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1536Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            secrets:
              - smtp-credentials
          config:
            route:
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: email
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: tibor@pilz.berlin
                    from: alertmanager@tibor.sh
                    smarthost: smtp.mx.cloudflare.net:465
                    auth_username: api_token
                    auth_password_file: /etc/alertmanager/secrets/smtp-credentials/password
                    force_implicit_tls: true
                    send_resolved: true

        grafana:
          enabled: true
          envFromSecret: grafana-secrets
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: true
            storageClassName: ceph-block
            size: 5Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          sidecar:
            datasources:
              # Turns the span-metric exemplars into clickable links to the
              # originating span in Jaeger.
              exemplarTraceIdDestinations:
                datasourceUid: tempo
                traceIdLabelName: trace_id
                urlDisplayLabel: View trace
          grafana.ini:
            server:
              root_url: https://grafana.tibor.sh
            auth:
              oauth_auto_login: false
            "auth.generic_oauth":
              enabled: true
              name: Authentik
              scopes: "openid profile email groups"
              auth_url: https://auth.tibor.sh/application/o/authorize/
              token_url: https://auth.tibor.sh/application/o/token/
              api_url: https://auth.tibor.sh/application/o/userinfo/
              use_pkce: true
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"
              allow_assign_grafana_admin: true
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              jsonData:
                derivedFields:
                  - name: TraceID
                    matcherRegex: '(?:trace_id|traceID|trace\.id)"?[:=]"?(\w+)'
                    url: "$${__value.raw}"
                    datasourceUid: tempo
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                tracesToMetrics:
                  datasourceUid: prometheus
            - name: Jaeger
              type: jaeger
              uid: jaeger
              access: proxy
              url: http://jaeger.observability.svc.cluster.local:16686
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                tracesToMetrics:
                  datasourceUid: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
