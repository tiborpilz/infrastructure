apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secrets.enc.yaml
  - argo-app-kube-prometheus-stack.yaml
  - argo-app-loki.yaml
  - argo-app-alloy.yaml
  - alloy-rbac.yaml
  - argo-app-tempo.yaml
  - bucket-tempo.yaml
  - argo-app-jaeger.yaml
  - argo-app-jaeger-oauth2-proxy.yaml
  - argo-app-otel-collector.yaml
  - httproute-grafana.yaml
  - httproute-jaeger.yaml
  - httproute-otel.yaml

# Grafana provisions dashboards from ConfigMaps labelled grafana_dashboard via
# the kube-prometheus-stack sidecar. Ceph metrics come from the rook-ceph-mgr
# ServiceMonitor (rook monitoring.enabled).
configMapGenerator:
  - name: grafana-dashboards-ceph
    files:
      - dashboards/ceph-cluster.json
      - dashboards/ceph-osds-overview.json
      - dashboards/ceph-pool-overview.json
      - dashboards/ceph-rbd-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboards-openrouter
    files:
      - dashboards/openrouter-llm.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
