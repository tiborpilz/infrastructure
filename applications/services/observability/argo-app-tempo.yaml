apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 2.3.0
    helm:
      releaseName: tempo
      valuesObject:
        fullnameOverride: tempo
        tempo:
          storage:
            trace:
              backend: s3
              s3:
                bucket: ${BUCKET_NAME}
                endpoint: ${BUCKET_HOST}:${BUCKET_PORT}
                access_key: ${AWS_ACCESS_KEY_ID}
                secret_key: ${AWS_SECRET_ACCESS_KEY}
                insecure: true
              wal:
                path: /var/tempo/wal
          retention: 720h
          # TraceQL metrics queries (rate(), quantile_over_time(), and the
          # Traces Drilldown app) are answered by the metrics generator. With
          # it off, Tempo has no generator in its ring and every such query
          # fails with "error finding generators: empty ring".
          #
          # Only local-blocks is enabled: it is the processor that serves
          # TraceQL metrics. span-metrics and service-graphs are deliberately
          # left off because the otel-collector already derives span metrics,
          # and enabling them here would remote-write a duplicate set.
          metricsGenerator:
            enabled: true
            # local-blocks writes nothing here, but the chart always emits a
            # remote_write block; point it at the real Prometheus so Tempo is
            # not retrying a service that does not exist.
            remoteWriteUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
            processor:
              local_blocks:
                flush_to_storage: true
            storage:
              # On the PVC rather than the chart's default /tmp emptyDir, so
              # generator blocks survive a restart.
              path: /var/tempo/metrics
            traces_storage:
              path: /var/tempo/metrics-traces
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - local-blocks
          memBallastSizeMbs: 0
          reportingEnabled: false
          extraArgs:
            config.expand-env: "true"
          extraEnvFrom:
            - secretRef:
                name: tempo-storage
            - configMapRef:
                name: tempo-storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        persistence:
          enabled: true
          storageClassName: ceph-block
          size: 10Gi
        tempoQuery:
          enabled: false
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
