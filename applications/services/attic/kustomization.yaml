apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secrets.enc.yaml
  - database.yaml
  - bucket.yaml
  - config.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

images:
  # attic publishes no semver tags, only per-commit SHAs and `latest`, so this
  # is pinned by digest. Renovate cannot bump it; update it deliberately.
  - name: ghcr.io/zhaofengli/attic
    digest: sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
