apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attic
  namespace: attic
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - attic.tibor.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: attic
          port: 80
      timeouts:
        # NAR uploads of large closures are slow; the 15s Gateway API default
        # would abort them mid-push.
        request: 30m
        backendRequest: 30m
