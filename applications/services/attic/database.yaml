apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db
  namespace: attic
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 10Gi
    storageClass: ceph-block
  bootstrap:
    initdb:
      database: attic
      owner: attic
  monitoring:
    enablePodMonitor: false
