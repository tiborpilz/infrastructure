# Provisions a bucket in the Rook CephObjectStore (applications/storage/rook).
# Rook creates a Secret and a ConfigMap both named after this OBC:
#   Secret    attic-storage -> AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   ConfigMap attic-storage -> BUCKET_NAME, BUCKET_HOST, BUCKET_PORT, BUCKET_REGION
# bucketName (not generateBucketName) is used so the name is deterministic and
# can be hardcoded in the server config below.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: attic-storage
  namespace: attic
spec:
  bucketName: attic
  storageClassName: ceph-bucket
