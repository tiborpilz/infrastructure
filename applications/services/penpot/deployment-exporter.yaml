apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot
        app.kubernetes.io/component: exporter
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: penpotapp/exporter
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6061
          envFrom:
            - configMapRef:
                name: penpot-config
            - configMapRef:
                name: penpot-exporter-config
          env:
            # Shared with the backend: the exporter verifies the export tokens
            # the backend signs, so the two must derive keys from the same root.
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-secrets
                  key: PENPOT_SECRET_KEY
          volumeMounts:
            # Chromium maps shared memory here; the 64Mi default that the
            # runtime provides makes it crash part-way through large renders.
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
