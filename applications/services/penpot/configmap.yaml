apiVersion: v1
kind: ConfigMap
metadata:
  name: penpot-config
  namespace: penpot
data:
  PENPOT_FLAGS: >-
    enable-login-with-oidc
    enable-oidc-registration
    disable-registration
    disable-login-with-password
    disable-email-verification
    enable-smtp
  PENPOT_PUBLIC_URI: https://penpot.tibor.sh
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: penpot-backend-config
  namespace: penpot
data:
  PENPOT_DATABASE_URI: postgresql://penpot-db-rw/penpot
  PENPOT_REDIS_URI: redis://penpot-valkey/0
  PENPOT_OBJECTS_STORAGE_BACKEND: fs
  PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
  PENPOT_TELEMETRY_ENABLED: "false"

  PENPOT_OIDC_CLIENT_ID: penpot
  PENPOT_OIDC_BASE_URI: https://auth.tibor.sh/application/o/penpot/
  # Penpot only autodiscovers these when auth/token/user URIs are all unset, and
  # a failed discovery at boot silently disables OIDC for the process lifetime.
  PENPOT_OIDC_AUTH_URI: https://auth.tibor.sh/application/o/authorize/
  PENPOT_OIDC_TOKEN_URI: https://auth.tibor.sh/application/o/token/
  PENPOT_OIDC_USER_URI: https://auth.tibor.sh/application/o/userinfo/
  PENPOT_OIDC_JWKS_URI: https://auth.tibor.sh/application/o/penpot/jwks/
  PENPOT_OIDC_SCOPES: openid profile email

  PENPOT_SMTP_HOST: smtp.mx.cloudflare.net
  PENPOT_SMTP_PORT: "465"
  PENPOT_SMTP_USERNAME: api_token
  PENPOT_SMTP_SSL: "true"
  PENPOT_SMTP_TLS: "false"
  PENPOT_SMTP_DEFAULT_FROM: Penpot <noreply@tibor.sh>
  PENPOT_SMTP_DEFAULT_REPLY_TO: Penpot <noreply@tibor.sh>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: penpot-frontend-config
  namespace: penpot
data:
  PENPOT_BACKEND_URI: http://penpot-backend:6060
  PENPOT_EXPORTER_URI: http://penpot-exporter:6061
  # Label on the SSO button; frontend-only.
  PENPOT_OIDC_NAME: authentik
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: penpot-exporter-config
  namespace: penpot
data:
  PENPOT_INTERNAL_URI: http://penpot
  PENPOT_REDIS_URI: redis://penpot-valkey/0
