apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  namespace: outline
  labels:
    app.kubernetes.io/name: outline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: outlinewiki/outline
          # image ships no yarn/npm; db:migrate is just a wrapper for sequelize
          command: ["node", "node_modules/.bin/sequelize", "db:migrate", "--env=production-ssl-disabled"]
          env:
            - name: PGSSLMODE
              value: disable
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outline-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: outline
          image: outlinewiki/outline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: URL
              value: https://outline.tibor.sh
            - name: PORT
              value: "3000"
            - name: PGSSLMODE
              value: disable
            - name: REDIS_URL
              value: redis://outline-valkey:6379
            - name: FILE_STORAGE
              value: local
            - name: FILE_STORAGE_LOCAL_ROOT_DIR
              value: /var/lib/outline/data
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "262144000"
            - name: OIDC_CLIENT_ID
              value: outline
            - name: OIDC_AUTH_URI
              value: https://auth.tibor.sh/application/o/authorize/
            - name: OIDC_TOKEN_URI
              value: https://auth.tibor.sh/application/o/token/
            - name: OIDC_USERINFO_URI
              value: https://auth.tibor.sh/application/o/userinfo/
            - name: OIDC_USERNAME_CLAIM
              value: preferred_username
            - name: OIDC_DISPLAY_NAME
              value: authentik
            - name: OIDC_SCOPES
              value: openid profile email
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outline-db-app
                  key: uri
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: SECRET_KEY
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: UTILS_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-oidc
                  key: client-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/outline/data
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outline-data
