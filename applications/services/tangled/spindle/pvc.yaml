apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spindle-state
  namespace: tangled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spindle-scratch
  namespace: tangled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: ceph-block
  resources:
    requests:
      storage: 100Gi
