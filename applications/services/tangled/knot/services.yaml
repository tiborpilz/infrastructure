apiVersion: v1
kind: Service
metadata:
  name: tangled-http
  namespace: tangled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tangled-knot
  ports:
    - name: http
      port: 5555
      targetPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: tangled-ssh
  namespace: tangled
  annotations:
    lbipam.cilium.io/ips: 195.201.170.143
    external-dns.alpha.kubernetes.io/hostname: ssh.knot.tibor.sh
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  selector:
    app.kubernetes.io/name: tangled-knot
  ports:
    - name: ssh
      port: 22
      targetPort: 22
