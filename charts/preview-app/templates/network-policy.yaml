apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  # Default-deny. The CiliumNetworkPolicy below is the only ingress allow.
  policyTypes:
    - Ingress
    - Egress
---
# Cilium's gateway proxy carries the reserved "ingress" identity, which a
# NetworkPolicy cannot select.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-from-cilium-gateway
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ .Values.container.port | quote }}
              protocol: TCP
